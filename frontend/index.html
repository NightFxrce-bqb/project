<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PifPaf AI - Блогеры</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Auth Section -->
  <section id="auth-section" class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <h1>PifPaf<span>AI</span></h1>
        <p>Панель блогера</p>
      </div>
      
      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <h2>Вход</h2>
        <div class="form-group">
          <input type="email" id="login-email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Пароль" required>
        </div>
        <button type="submit" class="btn-primary">Войти</button>
        <p class="switch-form">Нет аккаунта? <a href="#" onclick="showRegister()">Регистрация</a></p>
        <p id="login-error" class="error-msg"></p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden">
        <h2>Регистрация</h2>
        <div class="form-group">
          <input type="text" id="reg-name" placeholder="Имя" required>
        </div>
        <div class="form-group">
          <input type="email" id="reg-email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="reg-password" placeholder="Пароль" required>
        </div>
        <button type="submit" class="btn-primary">Создать аккаунт</button>
        <p class="switch-form">Есть аккаунт? <a href="#" onclick="showLogin()">Вход</a></p>
        <p id="reg-error" class="error-msg"></p>
      </form>
    </div>
  </section>

  <!-- Dashboard Section -->
  <section id="dashboard-section" class="hidden">
    <header class="dashboard-header">
      <div class="header-left">
        <h1>PifPaf<span>AI</span></h1>
        <span class="user-name" id="user-name"></span>
      </div>
      <div class="header-right">
        <button class="btn-secondary" onclick="showAddReelModal()">+ Добавить Reel</button>
        <button class="btn-logout" onclick="logout()">Выход</button>
      </div>
    </header>

    <div class="dashboard-content">
      <!-- Stats Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">👁</div>
          <div class="stat-info">
            <span class="stat-value" id="total-views">0</span>
            <span class="stat-label">Всего просмотров</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📹</div>
          <div class="stat-info">
            <span class="stat-value" id="total-reels">0</span>
            <span class="stat-label">Reels</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📊</div>
          <div class="stat-info">
            <span class="stat-value" id="avg-views">0</span>
            <span class="stat-label">Среднее</span>
          </div>
        </div>
      </div>

      <!-- Period Filter -->
      <div class="filter-bar">
        <select id="period-filter" onchange="loadAnalytics()">
          <option value="all">За все время</option>
          <option value="30d">За 30 дней</option>
          <option value="7d">За 7 дней</option>
        </select>
      </div>

      <!-- Reels Grid (Pinterest Style) -->
      <h2 class="section-title">Мои Reels</h2>
      <div class="reels-grid" id="reels-grid">
        <!-- Reels will be loaded here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">📱</div>
        <h3>Пока нет Reels</h3>
        <p>Добавьте свою первую ссылку на Instagram Reel</p>
        <button class="btn-primary" onclick="showAddReelModal()">Добавить Reel</button>
      </div>
    </div>
  </section>

  <!-- Add Reel Modal -->
  <div id="add-reel-modal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close" onclick="hideAddReelModal()">&times;</span>
      <h2>Добавить Reel</h2>
      <form id="add-reel-form">
        <div class="form-group">
          <input type="url" id="reel-url" placeholder="Ссылка на Instagram Reel" required>
        </div>
        <button type="submit" class="btn-primary">Добавить</button>
      </form>
      <p id="add-reel-error" class="error-msg"></p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
